name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_SERVER: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('backend/**/*.csproj', 'backend/Directory.Build.props', 'backend/global.json') }}
          restore-keys: nuget-${{ runner.os }}-
      - name: Build (warnings are errors)
        working-directory: backend
        run: dotnet build
      - name: Tests
        working-directory: backend
        run: dotnet test --no-build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: API types match docs/openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- src/api/schema.d.ts || { echo "::error::src/api/schema.d.ts is stale: run npm run api:types in frontend."; exit 1; }
      - run: npm test
      - run: npm run build

  docker:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: noosphere:ci
      - name: Compose file is valid
        run: docker compose --env-file .env.example config --quiet
